[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geometry-assistant"
version = "0.1.0"
description = "Ask questions about a 3D model in plain language: an LLM chooses whitelisted geometry tools, never computes geometry itself."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rabie ES-SAYEH" }]
requires-python = ">=3.11"
dependencies = [
    "trimesh>=4.4",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",  # file uploads
    "openai>=1.30",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # required by fastapi.testclient
    "ruff>=0.6",
    "manifold3d>=2.5",  # boolean operations in scripts/make_sample_models.py
]

[project.urls]
Repository = "https://github.com/rabieessayeh/geometry-assistant"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["static/*", "static/js/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplifications
    "C4",  # comprehensions
    "D",   # docstrings
    "T20", # no print()
]
ignore = [
    "D203", # conflicts with D211 (no blank line before class docstring)
    "D213", # conflicts with D212 (summary on the first docstring line)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
